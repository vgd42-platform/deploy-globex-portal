# dev: updated automatically by the platform build (a PR per commit, merges itself when checks pass).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# --- Version label (read by the 360 view), set together with the image ---
labels:
  - pairs:
      app.kubernetes.io/version: "1.0.0"
    includeSelectors: false
    includeTemplates: true
# --- The image this environment runs, pinned by digest ---
images:
  - name: app-image
    newName: acrvgd42.azurecr.io/globex/portal
    digest: sha256:09785d791934c20d9db055bd41365ab775f0c33bcc3d307337225d6d7d6ac355
