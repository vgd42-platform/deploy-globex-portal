apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: portal
    demo/vendor: globex
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      # --- Labels the 360 view uses (version is added per environment) ---
      labels:
        app.kubernetes.io/name: portal
        demo/vendor: globex
        azure.workload.identity/use: "true"   # inject the Azure identity token
    spec:
      serviceAccountName: portal
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: portal
          image: app-image   # replaced per environment by envs/<env>/kustomization.yaml
          ports:
            - containerPort: 8080
          # --- Settings for the app; no secrets anywhere ---
          env:
            - { name: VENDOR, value: "globex" }
            - { name: APP, value: "portal" }
            - { name: STORAGE_ACCOUNT_URL, value: "https://stvgd42globexportal.blob.core.windows.net" }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          # --- Limits are required by platform policy and by the namespace quota ---
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
